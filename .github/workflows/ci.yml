name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff

      # Day-one gate is intentionally narrow: real errors only (syntax errors,
      # undefined names), not style. The full default rule set currently flags
      # ~830 pre-existing style issues (unused imports, f-strings without
      # placeholders, etc.) that aren't bugs — failing CI on those would make
      # the gate noise instead of signal. See docs/TESTING.md.
      - name: Lint (errors only)
        run: ruff check . --select E9,F821,F822,F823

      # Tests use a local sqlite file (tests/test_api.py), no external services
      # or DATABASE_URL needed.
      - name: Test
        run: python -m pytest -q

  migrations:
    name: Migration chain (Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: desiconnect_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # sqlite (used by the test suite above) can't replay this chain from
      # scratch, so this is the only place a broken down_revision link,
      # duplicate/missing head, or migration-file SQL error gets caught
      # before it reaches production — Railway's preDeployCommand runs this
      # same command against real prod Postgres with no gate in front of it.
      - name: Apply full migration chain to a clean Postgres
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/desiconnect_ci
        run: alembic upgrade head

  # Deploys — only for a push to main, only after both jobs above pass on this
  # exact commit. Replaces Railway's own GitHub trigger, whose "wait for CI"
  # hung on most merges (see .github/scripts/deploy-railway.sh). Staging goes
  # first so every migration runs against a real Postgres with real-shaped
  # data before it touches production. The concurrency groups keep deploys in
  # merge order; a newer one waits rather than cancelling one already running
  # its migrations.
  #
  # Each job runs in the GitHub environment of the same name, which holds its
  # RAILWAY_TOKEN secret (a project token only works for its own Railway
  # environment) and, for staging, the RAILWAY_ENVIRONMENT_ID variable.
  deploy-staging:
    name: Deploy to staging
    needs: [test, migrations]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: railway-staging
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Deploy this commit and wait for it
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: .github/scripts/deploy-railway.sh

  # The `production` environment requires a reviewer's approval, so this job
  # waits in the Actions tab after staging succeeds — check staging, then
  # approve. Rejecting (or never approving) leaves production where it was.
  deploy-production:
    name: Deploy to production
    needs: [deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: railway-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Deploy this commit and wait for it
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_ENVIRONMENT_ID: d4a7b9a8-3797-47af-982e-7389585c9004
          COMMIT_SHA: ${{ github.sha }}
        run: .github/scripts/deploy-railway.sh
