name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff

      # Day-one gate is intentionally narrow: real errors only (syntax errors,
      # undefined names), not style. The full default rule set currently flags
      # ~830 pre-existing style issues (unused imports, f-strings without
      # placeholders, etc.) that aren't bugs — failing CI on those would make
      # the gate noise instead of signal. See docs/TESTING.md.
      - name: Lint (errors only)
        run: ruff check . --select E9,F821,F822,F823

      # Tests use a local sqlite file (tests/test_api.py), no external services
      # or DATABASE_URL needed.
      - name: Test
        run: python -m pytest -q

  migrations:
    name: Migration chain (Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: desiconnect_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # sqlite (used by the test suite above) can't replay this chain from
      # scratch, so this is the only place a broken down_revision link,
      # duplicate/missing head, or migration-file SQL error gets caught
      # before it reaches production — Railway's preDeployCommand runs this
      # same command against real prod Postgres with no gate in front of it.
      - name: Apply full migration chain to a clean Postgres
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/desiconnect_ci
        run: alembic upgrade head

  # Production deploy — only for a push to main, only after both jobs above
  # pass on this exact commit. Replaces Railway's own GitHub trigger, whose
  # "wait for CI" hung on most merges (see .github/scripts/deploy-railway.sh).
  # The concurrency group keeps deploys in merge order; a newer one waits
  # rather than cancelling one already running its migrations.
  deploy:
    name: Deploy to Railway
    needs: [test, migrations]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: railway-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy this commit and wait for it
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: .github/scripts/deploy-railway.sh
