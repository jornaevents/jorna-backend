name: Add to Jorna Dev Board

# GitHub Free allows the board's own "Auto-add to project" workflow for one
# repo (jorna-website), so this repo's new issues are added here instead. The
# board's "Item added" workflow then sets them to Todo. Needs the
# ADD_TO_PROJECT_PAT secret: a fine-grained token owned by jornaevents with
# Projects read/write (the default GITHUB_TOKEN can't write to org projects).

on:
  issues:
    types: [opened, reopened, transferred]

permissions: {}

jobs:
  add:
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT }}
    steps:
      # Skipped, not failed, until the secret is set.
      - if: env.TOKEN != ''
        uses: actions/add-to-project@v1
        with:
          project-url: https://github.com/orgs/jornaevents/projects/1
          github-token: ${{ env.TOKEN }}
