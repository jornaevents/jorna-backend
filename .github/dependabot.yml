version: 2
updates:
  # server/ — FastAPI backend dependencies
  - package-ecosystem: "pip"
    directory: "/server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # One PR a week for minor/patch bumps instead of one per package — every
    # merge here is a staging deploy plus a production approval. Majors still
    # arrive on their own, since those are the ones likely to break.
    groups:
      server-minor-patch:
        update-types: ["minor", "patch"]

  # ig_scraper/ — standalone Instagram vendor-data scraper (unrelated to the
  # FastAPI app's runtime, but still a real dependency surface)
  - package-ecosystem: "pip"
    directory: "/ig_scraper"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      ig-scraper-minor-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
